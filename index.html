<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Notes</title>
    <style>
        :root {
            --bg-color: #fffff8;
            --text-color: #111;
            --accent-color: #D64545;
            --secondary-color: #2E86C1;
            --font-body: 'Georgia', 'Times New Roman', serif;
            --font-head: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
        }

        header {
            max-width: 900px;
            margin: 0 auto 3rem auto;
            border-bottom: 1px solid #ddd;
            padding-bottom: 1rem;
        }

        h1 {
            font-family: var(--font-head);
            font-size: 2.5rem;
            margin: 0;
        }

        /* --- Filtering Section --- */
        .controls {
            max-width: 900px;
            margin: 0 auto 2rem auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: var(--font-head);
            font-size: 1rem;
            flex-grow: 1;
        }

        .tag-filter {
            background: #eee;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: var(--font-head);
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tag-filter:hover { background: #ddd; }
        .tag-filter.active { background: var(--secondary-color); color: white; }

        /* --- Grid Layout --- */
        .grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-color: var(--secondary-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-id {
            font-family: var(--font-head);
            font-weight: bold;
            color: #888;
            font-size: 0.9rem;
        }

        .difficulty {
            font-family: var(--font-head);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .diff-easy { background: #e8f5e9; color: #2e7d32; }
        .diff-medium { background: #fff3e0; color: #ef6c00; }
        .diff-hard { background: #ffebee; color: #c62828; }

        .card h2 {
            font-family: var(--font-head);
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }

        .card p {
            font-size: 0.95rem;
            color: #555;
            margin: 0 0 15px 0;
            flex-grow: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag {
            font-family: var(--font-head);
            font-size: 0.75rem;
            background: #f5f5f5;
            padding: 2px 8px;
            border-radius: 4px;
            color: #666;
        }
    </style>
</head>
<body>

<header>
    <h1>Algorithm Notebook</h1>
    <p style="color: #666; font-style: italic;">A collection of visualized solutions & philosophical breakdowns.</p>
</header>

<div class="controls">
    <input type="text" id="search-box" placeholder="Search by title or ID...">
    <!-- Tags will be injected here by JS -->
    <div id="tag-container" style="display:flex; gap:5px;"></div>
</div>

<div class="grid" id="solution-grid">
    <!-- Cards injected here -->
</div>

<script>
    let allData = [];
    let activeTag = null;

    async function loadSolutions() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error("Could not load data.json");
            allData = await response.json();
            
            generateTags();
            renderGrid(allData);
        } catch (error) {
            console.error(error);
            document.getElementById('solution-grid').innerHTML = `<p>Error loading solutions. Did you run <code>python generate_index.py</code>?</p>`;
        }
    }

    function generateTags() {
        const tags = new Set();
        allData.forEach(item => item.tags.forEach(t => tags.add(t)));
        
        const container = document.getElementById('tag-container');
        Array.from(tags).sort().forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'tag-filter';
            btn.innerText = tag;
            btn.onclick = () => toggleTag(tag, btn);
            container.appendChild(btn);
        });
    }

    function toggleTag(tag, btnElement) {
        const buttons = document.querySelectorAll('.tag-filter');
        
        if (activeTag === tag) {
            // Deactivate
            activeTag = null;
            btnElement.classList.remove('active');
        } else {
            // Activate new
            buttons.forEach(b => b.classList.remove('active'));
            activeTag = tag;
            btnElement.classList.add('active');
        }
        filterData();
    }

    function filterData() {
        const query = document.getElementById('search-box').value.toLowerCase();
        
        const filtered = allData.filter(item => {
            const matchesSearch = item.title.toLowerCase().includes(query) || 
                                  item.id.includes(query) ||
                                  item.description.toLowerCase().includes(query);
            const matchesTag = activeTag ? item.tags.includes(activeTag) : true;
            
            return matchesSearch && matchesTag;
        });

        renderGrid(filtered);
    }

    function renderGrid(items) {
        const grid = document.getElementById('solution-grid');
        grid.innerHTML = '';

        items.forEach(item => {
            const diffClass = `diff-${item.difficulty.toLowerCase()}`;
            
            const card = document.createElement('a');
            card.href = item.path;
            card.className = 'card';
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="card-id">#${item.id}</span>
                    <span class="difficulty ${diffClass}">${item.difficulty}</span>
                </div>
                <h2>${item.title}</h2>
                <p>${item.description}</p>
                <div class="card-tags">
                    ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Event Listeners
    document.getElementById('search-box').addEventListener('input', filterData);
    
    // Init
    loadSolutions();
</script>

</body>
</html>
